[package]
edition      = "2024"
name         = "cx"
rust-version = "1.97"
version      = "0.1.0"
resolve = 3
# [[bin]]
# name = "cx"
# path = "./src/bin/start_led.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }
ssd1306-i2c  = "0.1.5"
embedded-graphics = "0.8.2" 
defmt                  = "1.1.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
# embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embassy-futures = "0.1"
esp-alloc = { version = "0.11.0", features = ["defmt"] }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }

trouble-host = { version = "0.8.0", features = [
  "gatt",
  "default-packet-pool-mtu-255",
  "derive",
  "scan",
  "defmt",
  "security",
  ]}

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-sync = {version="0.8.0",features=["defmt"]}
# bt-hci = {version="0.9.0",features=["defmt","embassy-time"]}

esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c6"] }
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "dns",
    "defmt",
    "udp",
] }
reqwless = { version = "0.14.0", default-features = false ,features=["defmt"]}
# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
